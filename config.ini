; config.ini
[config_base]
build_flags =
  -D FIRMWARE_VERSION='"6.0.0"'

[config_l298n]
build_flags =
  ${config_base.build_flags}
  -D L298N=1
  -D HBRIDGE=1

[config_l298n-dual]
build_flags =
  ${config_base.build_flags}
  ${config_l298n.build_flags}
  -D DUAL=1

[config_tb6612fng]
build_flags =
  ${config_base.build_flags}
  -D TB6612FNG=2
  -D HBRIDGE=2

[config_tb6612fng_dual]
build_flags =
  ${config_base.build_flags}
  ${config_tb6612fng.build_flags}
  -D DUAL=1

[config_bts7960]
build_flags =
  ${config_base.build_flags}
  -D BTS7960=3
  -D HBRIDGE=3

[config_bts7960_dual]
build_flags =
  ${config_base.build_flags}
  ${config_bts7960.build_flags}
  -D DUAL=1